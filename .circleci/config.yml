# Optimus Prime CI
# Node CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-javascript/ for more details
#
version: 2.1
executors:
  node:
    docker:
      - image: circleci/node:12.13
jobs:
  test-api:
    executor: node
    working_directory: ~/repo
    steps:
      - checkout
      # Download and cache dependencies
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "package.json" }}
            # fallback to using the latest cache if no exact match is found
            - v1-dependencies-

      - run: yarn install

      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "package.json" }}

      # run tests!
      - run: yarn test:ci
      - store_test_results:
          path: ./test-results
  test-prod-build:
    executor: node
    working_directory: ~/repo
    steps:
      - checkout
      # Download and cache dependencies
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "package.json" }}
            # fallback to using the latest cache if no exact match is found
            - v1-dependencies-
      - run:
          name: Build
          command: yarn build
      - run:
          name: Run
          command: yarn start:webpack
          background: true
      - run:
          name: Stop
          command: sleep 5 && npx pm2 kill && exit 0
  version:
    executor: node
    working_directory: ~/repo
    steps:
      - checkout
      # add write permissions to circleci ssh
      - add_ssh_keys:
          fingerprints:
            - "34:47:b3:8e:99:c6:02:dc:73:aa:6f:c5:f6:1b:49:3d"
      - run: ./scripts/release.sh
  hot_rod_trigger:
    executor: node
    steps:
      - run: curl -u e99e65893fe7332bfff1da8abfd39aadac7d7e35 -d build_parameters[CIRCLE_JOB]=e2e https://circleci.com/api/v1.1/project/github/Edji-it/edji-hotrod/tree/dev
workflows:
  version: 2
  test-api:
    jobs:
      - test-api
      - test-prod-build:
          requires:
            - test-api
      - version:
          requires:
            - test-api
            - test-prod-build
          filters:
            branches:
              only:
                - dev
      - hot_rod_trigger:
          requires:
            - test-api
            - test-prod-build
          filters:
            branches:
              only:
                - dev
