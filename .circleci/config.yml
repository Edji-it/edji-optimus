# Optimus Prime CI
# Node CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-javascript/ for more details
#
version: 2.1
executors:
  node:
    docker:
      - image: circleci/node:12.13
jobs:
  build:
    executor: node
    working_directory: ~/repo
    steps:
      - checkout
      # Download and cache dependencies
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "package.json" }}
            # fallback to using the latest cache if no exact match is found
            - v1-dependencies-

      - run: yarn install

      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "package.json" }}

      # run tests!
      - run: yarn test:ci
      - store_test_results:
          path: ./test-results
  test-prod-build:
    executor: node
    working_directory: ~/repo
    steps:
      - checkout
      # Download and cache dependencies
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "package.json" }}
            # fallback to using the latest cache if no exact match is found
            - v1-dependencies-
      - run:
          name: Build
          command: yarn build
      - run:
          name: Run
          command: yarn start:webpack
          background: true
      - run:
          name: Stop
          command: sleep 5 && npx pm2 kill && exit 0
  version:
    executor: node
    working_directory: ~/repo
    steps:
      - checkout
      # add write permissions to circleci ssh
      - add_ssh_keys:
          fingerprints:
            - "17:5b:f9:81:92:12:12:30:60:e4:cc:a7:a7:ac:84:94"
      - run: ./scripts/release.sh
  hot_rod_trigger:
    executor: node
    steps:
      - run: curl -u 0a71eebb7f0d5de3c260dae4c44b8ad8f7064df8 -d build_parameters[CIRCLE_JOB]=e2e https://circleci.com/api/v1.1/project/github/codiak/edji-hotrod/tree/dev
workflows:
  version: 2
  test:
    jobs:
      - build
      - test-prod-build:
          requires:
            - build
      - version:
          requires:
            - build
            - test-prod-build
          filters:
            branches:
              only:
                - dev
      - hot_rod_trigger:
          requires:
            - build
            - test-prod-build
          filters:
            branches:
              only:
                - dev
