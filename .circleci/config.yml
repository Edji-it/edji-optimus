# Optimus Prime CI
# Node CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-javascript/ for more details
#
version: 2
jobs:
  build:
    docker:
      # specify the version you desire here
      - image: circleci/node:10.15

      # Specify service dependencies here if necessary
      # CircleCI maintains a library of pre-built images
      # documented at https://circleci.com/docs/2.0/circleci-images/
      # - image: circleci/mongo:3.4.4

    working_directory: ~/repo

    steps:
      - checkout
      # Download and cache dependencies
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "package.json" }}
            # fallback to using the latest cache if no exact match is found
            - v1-dependencies-

      - run: yarn install

      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "package.json" }}

      # run tests!
      - run: yarn test:ci
      - store_test_results:
          path: ./test-results
  version:
    docker:
      - image: circleci/node:10.15
    working_directory: ~/repo
    steps:
      - checkout
      # add write permissions to circleci ssh
      - add_ssh_keys:
          fingerprints:
            - "17:5b:f9:81:92:12:12:30:60:e4:cc:a7:a7:ac:84:94"
      - run: ./scripts/release.sh
  hot_rod_trigger:
    docker:
      - image: circleci/node:10.15
    steps:
      - run: curl -u 0a71eebb7f0d5de3c260dae4c44b8ad8f7064df8 -d build_parameters[CIRCLE_JOB]=e2e https://circleci.com/api/v1.1/project/github/codiak/edji-hotrod/tree/dev
workflows:
  version: 2
  test:
    jobs:
      - build
      - version:
          filters:
            branches:
              only:
                - dev
      - hot_rod_trigger:
          requires:
            - build
          filters:
            branches:
              only:
                - dev
